version: 2
updates:
  # npm dependencies declared in package.json at the repo root
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One PR per ecosystem per week instead of one per dependency. `main` has
      # strict required status checks, so every extra PR costs its own serial
      # update/CI/merge cycle -- grouping is what keeps that bounded.
      npm:
        patterns:
          - "*"

  # Python dependencies declared in requirements.txt and requirements-test.txt
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns:
          - "*"

  # GitHub Actions workflow dependencies in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
