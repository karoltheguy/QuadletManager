name: Build and Push Container Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  # Tag builds do NOT trigger here directly -- release.yml calls this after the
  # test suite passes, so `:latest` can never move ahead of a red suite. The
  # caller's context still reports the tag as `github.ref`, which is what the
  # semver tagging and `latest` gating below key off.
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    # Only run on GitHub
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Tags are needed here: the version derivation below runs `git
          # describe --tags` against this checkout (inside `core.version`), and
          # a default depth-1 checkout fetches no tags at all. Dropping this
          # now fails the build rather than silently mis-versioning the image.
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to the Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` tracks the newest release, not the tip of main -- main
          # pushes are already published as `main` by type=ref,event=branch
          # below. Anyone who wants the development build pulls `:main`.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Compute app version
        id: app_version
        # Every build carries its run number (see #158) so images stay
        # traceable, but where it goes depends on the build: a tag build is the
        # release it claims to be, so it goes in build metadata
        # (`0.3.0+build.520`); any other build is ahead of the last tag, so it
        # becomes a prerelease of the next release (`0.4.0-dev.514`). The rules
        # live in core/version.py alongside the runtime read, so there is one
        # place the version is defined and it is unit-testable.
        # Assigned first, not inlined into the echo: command substitution inside
        # `echo` would discard the exit status, and a failed lookup would set an
        # empty version on a green step.
        run: |
          set -euo pipefail
          version="$(python3 -m core.version)"
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.app_version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
