name: Release

on:
  push:
    tags: [ "v*.*.*" ]

# The tag pipeline is deliberately linear:
#
#   test ──> image ──> release
#
# Nothing outward-facing happens until everything upstream is green: `image`
# moves the `:latest` container tag and `release` publishes a GitHub Release.
# The git tag itself is the single source of truth for the version, so there
# is nothing left to verify before `test` runs.
jobs:
  test:
    name: Test
    uses: ./.github/workflows/tests.yml
    permissions:
      # test-github pushes coverage badges.
      contents: write

  image:
    name: Image
    needs: test
    uses: ./.github/workflows/container-build.yml
    permissions:
      contents: read
      packages: write

  release:
    name: Create GitHub Release
    needs: image
    # Only run on GitHub, matching container-build.yml -- the Forgejo mirror
    # has no `gh release` endpoint.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # gh resolves the target repo from the checkout's git remote. The notes
      # themselves are generated server-side, so no history is needed here.
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag carrying a prerelease segment (v0.2.0-rc.1) must not become
          # the repo's "Latest release", which is what GitHub would otherwise
          # do for the newest tag.
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac

          # The release may already exist. Publishing one from the GitHub UI
          # creates the tag, and that tag push is what triggered this run, so
          # `create` would fail with a 422 and turn the whole release run red.
          # An existing release was written by hand, so its title and notes are
          # left untouched; only the prerelease guard below is still enforced,
          # since the UI makes it easy to forget and GitHub would otherwise
          # promote the tag to "Latest".
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; keeping its title and notes."
            if [ -n "$prerelease" ]; then
              gh release edit "$GITHUB_REF_NAME" --prerelease
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              $prerelease
          fi
