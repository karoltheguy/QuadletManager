name: Release

on:
  push:
    tags: [ "v*.*.*" ]

jobs:
  release:
    name: Create GitHub Release
    # Only run on GitHub, matching container-build.yml -- the Forgejo mirror
    # has no `gh release` endpoint.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # --generate-notes diffs against the previous tag, so the full
          # history has to be present.
          fetch-depth: 0

      - name: Verify VERSION matches the tag
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(cat VERSION)"
          if [ "$tagged" != "$declared" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} implies version '${tagged}' but VERSION declares '${declared}'."
            echo "Bump VERSION on main, then re-tag."
            exit 1
          fi
          echo "Releasing ${declared}"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag carrying a prerelease segment (v0.2.0-rc.1) must not become
          # the repo's "Latest release", which is what GitHub would otherwise
          # do for the newest tag.
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease
