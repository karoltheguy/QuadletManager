<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuadletManager – Login</title>
    <meta name="description" content="Login to QuadletManager Dashboard to manage your Podman Quadlet containers.">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('qm-theme');
                if (saved === 'light' || saved === 'dark') {
                    document.documentElement.dataset.theme = saved;
                }
            } catch {
                // localStorage is unavailable (private mode / blocked storage);
                // fall through and keep the default theme.
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ── Design tokens (subset of style.css) ────────────────
           Self-contained so the login page has zero external CSS deps. */
        :root,
        :root[data-theme="dark"] {
            --bg-base:    #1c1f24;
            --bg-surface: #22262d;
            --bg-element: #2a2e36;
            --border-color: #2e333b;
            --text-primary: #e8ecf0;
            --text-muted:   #8b9199;
            --brand-primary: #14b8a6;
            --danger: #ef4444;
            --nm-shadow-dark:  rgba(0, 0, 0, 0.55);
            --nm-shadow-light: rgba(255, 255, 255, 0.04);
            --shadow-raised:
                8px 8px 20px var(--nm-shadow-dark),
                -6px -6px 16px var(--nm-shadow-light),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            --shadow-raised-sm:
                4px 4px 10px var(--nm-shadow-dark),
                -3px -3px 8px var(--nm-shadow-light),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            --shadow-inset:
                inset 4px 4px 10px var(--nm-shadow-dark),
                inset -3px -3px 8px var(--nm-shadow-light);
            --radius-lg: 1.25rem;
            --radius-md: 0.75rem;
        }

        :root[data-theme="light"] {
            --bg-base:    #e8ecf0;
            --bg-surface: #eef1f5;
            --bg-element: #e0e4ea;
            --border-color: #d3d8e0;
            --text-primary: #1c1f24;
            --text-muted:   #6b7280;
            --brand-primary: #0e7268;
            --danger: #dc2626;
            --nm-shadow-dark:  rgba(163, 177, 198, 0.55);
            --nm-shadow-light: rgba(255, 255, 255, 0.9);
            --shadow-raised:
                8px 8px 20px var(--nm-shadow-dark),
                -8px -8px 20px var(--nm-shadow-light),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            --shadow-raised-sm:
                4px 4px 10px var(--nm-shadow-dark),
                -4px -4px 10px var(--nm-shadow-light),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            --shadow-inset:
                inset 4px 4px 10px var(--nm-shadow-dark),
                inset -4px -4px 10px var(--nm-shadow-light);
        }

        @media (prefers-color-scheme: light) {
            :root:not([data-theme]) {
                --bg-base:    #e8ecf0;
                --bg-surface: #eef1f5;
                --bg-element: #e0e4ea;
                --border-color: #d3d8e0;
                --text-primary: #1c1f24;
                --text-muted:   #6b7280;
                --brand-primary: #0e7268;
                --danger: #dc2626;
                --nm-shadow-dark:  rgba(163, 177, 198, 0.55);
                --nm-shadow-light: rgba(255, 255, 255, 0.9);
                --shadow-raised:
                    8px 8px 20px var(--nm-shadow-dark),
                    -8px -8px 20px var(--nm-shadow-light),
                    inset 0 1px 0 rgba(255, 255, 255, 0.6);
                --shadow-raised-sm:
                    4px 4px 10px var(--nm-shadow-dark),
                    -4px -4px 10px var(--nm-shadow-light),
                    inset 0 1px 0 rgba(255, 255, 255, 0.6);
                --shadow-inset:
                    inset 4px 4px 10px var(--nm-shadow-dark),
                    inset -4px -4px 10px var(--nm-shadow-light);
            }
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Subtle teal-tinted ambient gradient — works in both themes */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 40%, rgba(20, 184, 166, 0.08) 0%, transparent 70%),
                radial-gradient(ellipse 60% 80% at 80% 60%, rgba(13, 148, 136, 0.06) 0%, transparent 70%),
                radial-gradient(ellipse 50% 50% at 50% 90%, rgba(16, 185, 129, 0.05) 0%, transparent 70%);
            animation: bgShift 12s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes bgShift {
            0%   { opacity: 0.7; transform: scale(1); }
            100% { opacity: 1;   transform: scale(1.06); }
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 0 20px;
        }

        .login-card {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            padding: 48px 40px 40px;
            box-shadow: var(--shadow-raised);
            animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Logo / Brand */
        .brand {
            text-align: center;
            margin-bottom: 36px;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            background: var(--brand-primary);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-raised-sm);
        }

        .brand-icon svg {
            width: 28px;
            height: 28px;
            color: #fff;
        }

        .brand h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .brand p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            transition: color 0.2s;
            pointer-events: none;
        }

        .input-wrapper input {
            width: 100%;
            background: var(--bg-base);
            border: none;
            border-radius: var(--radius-md);
            padding: 14px 16px 14px 44px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text-primary);
            outline: none;
            box-shadow: var(--shadow-inset);
            transition: box-shadow 0.2s;
        }

        .input-wrapper input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .input-wrapper input:focus {
            box-shadow: var(--shadow-inset), 0 0 0 2px var(--brand-primary);
        }

        .input-wrapper:focus-within svg {
            color: var(--brand-primary);
        }

        /* Login Button */
        .btn-login {
            width: 100%;
            padding: 14px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            letter-spacing: 0.02em;
            color: #fff;
            background: var(--brand-primary);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: var(--shadow-raised-sm);
            transition: box-shadow 0.15s, opacity 0.15s;
            margin-top: 8px;
        }

        .btn-login:hover {
            opacity: 0.92;
        }

        .btn-login:active {
            box-shadow: var(--shadow-inset);
            opacity: 1;
        }

        /* Error Message */
        .error-msg {
            background: var(--bg-base);
            box-shadow: var(--shadow-inset);
            border-radius: var(--radius-md);
            border-left: 3px solid var(--danger);
            padding: 12px 16px;
            font-size: 13px;
            color: var(--danger);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: shakeIn 0.4s ease-out;
        }

        .error-msg svg {
            width: 18px;
            height: 18px;
            color: var(--danger);
            flex-shrink: 0;
        }

        @keyframes shakeIn {
            0%   { transform: translateX(-8px); opacity: 0; }
            30%  { transform: translateX(4px); }
            60%  { transform: translateX(-2px); }
            100% { transform: translateX(0); opacity: 1; }
        }

        /* Footer hint */
        .footer-hint {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 24px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-card {
                padding: 36px 24px 32px;
            }
            .brand h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="brand">
                <div class="brand-icon">
                    <!-- Quadlet / container icon -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="2" width="20" height="8" rx="2"/>
                        <rect x="2" y="14" width="20" height="8" rx="2"/>
                        <circle cx="6" cy="6" r="1" fill="currentColor" stroke="none"/>
                        <circle cx="6" cy="18" r="1" fill="currentColor" stroke="none"/>
                    </svg>
                </div>
                <h1>QuadletManager</h1>
                <p>Podman Quadlet Dashboard</p>
            </div>

            {% if error %}
            <div class="error-msg">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="/login" id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" autofocus required>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="login-btn">Sign In</button>
            </form>

            <div class="footer-hint">
                Secured access &middot; Session expires after inactivity
            </div>
        </div>
    </div>
</body>
</html>
