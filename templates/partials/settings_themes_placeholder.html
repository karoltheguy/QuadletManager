<div id="themes-root">
  <p class="text-muted theme-placeholder-note">Theme editor UI coming in a future release.</p>
  <ul class="theme-placeholder-list">
    {% for t in themes %}
    <li class="theme-placeholder-item">
      <strong>{{ t[1] }}</strong>
      &nbsp;<span class="text-muted">({{ t[2] }})</span>
      {% if t[5] %}&nbsp;<em>active</em>{% endif %}
      &nbsp;&mdash;&nbsp;light: {{ t[3] }}&nbsp;/&nbsp;dark: {{ t[4] }}
    </li>
    {% else %}
    <li class="text-muted">No themes yet.</li>
    {% endfor %}
  </ul>
</div>
