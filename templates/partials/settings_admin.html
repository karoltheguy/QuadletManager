<div id="admin-root">
  <div class="form-row">
    <label class="form-label" for="admin-session-duration">Session duration</label>
    <select class="form-control" name="session_duration_seconds" id="admin-session-duration"
            hx-put="/api/settings/session-duration"
            hx-target="#admin-root"
            hx-swap="outerHTML"
            hx-include="this">
      {% for seconds, label in duration_choices %}
      <option value="{{ seconds }}" {% if seconds == current_seconds %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="form-row">
    <label class="form-label" for="admin-log-level">Log level</label>
    <select class="form-control" name="log_level" id="admin-log-level"
            hx-put="/api/settings/log-level"
            hx-target="#admin-root"
            hx-swap="outerHTML"
            hx-include="this">
      {% for level in log_level_choices %}
      <option value="{{ level }}" {% if level == current_log_level %}selected{% endif %}>{{ level.capitalize() }}</option>
      {% endfor %}
    </select>
  </div>
  {% if saved %}
  <p class="text-success">Settings updated.</p>
  {% endif %}
</div>
