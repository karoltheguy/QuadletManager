{% if keys %}
<table class="settings-table settings-keys-table">
  <thead>
    <tr>
      <th>Key Name</th>
      <th class="actions-col"><span class="visually-hidden">Actions</span></th>
    </tr>
  </thead>
  <tbody>
    {% for k in keys %}
    <tr>
      <td>{{ k[1] }}</td>
      <td class="actions-col">
        <button class="btn btn-sm btn-danger"
                hx-delete="/api/keys/{{ k[0] }}"
                hx-target="#keys-list"
                hx-swap="innerHTML"
                hx-confirm="Delete key '{{ k[1] }}'?">
          Delete
        </button>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p class="text-muted italic">No SSH keys stored yet.</p>
{% endif %}
