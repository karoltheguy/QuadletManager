<ul class="space-y-4 text-sm">
    {% for server in servers %}
    <li data-server-id="{{ server[0] }}">
        <div class="server-row">
            <button class="server-row-toggle"
                    onclick="window.toggleServerCollapse({{ server[0] }})"
                    aria-expanded="true"
                    aria-label="Toggle {{ server[1] }}">
                <span class="server-chevron">▾</span>
                <span class="font-bold text-lg">{{ server[1] }}</span>
            </button>
            {% if user_role == 'editor' %}
            <button class="server-new-btn"
                    hx-get="/api/modal/new?server_id={{ server[0] }}"
                    hx-target="body"
                    hx-swap="beforeend"
                    title="New quadlet on {{ server[1] }}"
                    aria-label="New quadlet on {{ server[1] }}">+</button>
            {% endif %}
        </div>
        <div class="pl-4 text-sm server-quadlet-tree" hx-get="/api/quadlets/{{ server[0] }}" hx-trigger="load">
            Scanning quadlets...
        </div>
    </li>
    {% else %}
    <li class="text-muted italic">No servers configured. Db seeded?</li>
    {% endfor %}
</ul>
