{% for scope in ['global', 'user'] %}
    <div class="font-semibold text-gray-400 mt-2 uppercase text-xs">{{ scope }} Scope</div>
    <ul class="space-y-1 mt-1">
    {% if not data[scope] %}
        <li class="text-gray-500 italic text-xs">No files found</li>
    {% else %}
        {% for file_info in data[scope] %}
        <li>
            <button class="text-blue-400 hover:text-blue-300 hover:underline text-left block w-full"
                    onclick="window.setActiveServer({{ server_id }})"
                    hx-get="/api/file/{{ server_id }}?path={{ file_info['path'] }}&scope={{ scope }}&name={{ file_info['name'] }}" hx-target="#editor-pane" hx-swap="outerHTML">
                📄 {{ file_info['name'] }}
            </button>
        </li>
        {% endfor %}
    {% endif %}
    </ul>
{% endfor %}
