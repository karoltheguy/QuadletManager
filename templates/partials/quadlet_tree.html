{% for scope in ['global', 'user'] %}
    <div class="font-semibold text-muted mt-2 uppercase text-xs">{{ scope }} Scope</div>
    <ul class="space-y-1 mt-1">
    {% if not data[scope] %}
        <li class="text-muted italic text-xs">No files found</li>
    {% else %}
        {% for file_info in data[scope] %}
        <li>
            <button class="quadlet-tree-btn text-accent block w-full text-sm"
                    onclick="window.setActiveServer({{ server_id }})"
                    hx-get="/api/file/{{ server_id }}?path={{ file_info['path'] }}&scope={{ scope }}&name={{ file_info['name'] }}" hx-target="#editor-pane" hx-swap="outerHTML">
                <span class="status-dot dot-stopped"
                      data-server-id="{{ server_id }}"
                      data-unit-stem="{{ file_info['name'].rsplit('.', 1)[0] }}"
                      title="Status unknown"></span>
                {{ file_info['name'] }}
            </button>
        </li>
        {% endfor %}
    {% endif %}
    </ul>
{% endfor %}
