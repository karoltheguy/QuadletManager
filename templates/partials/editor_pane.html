<div id="editor-pane" class="main-content">
    <div class="header-bar">
        <h2 class="panel-title">Editor: {{ name }}</h2>
        <span id="unsaved-indicator" hidden title="Unsaved changes" aria-label="Unsaved changes">●</span>
        <div class="header-actions">
            <div id="editor-actions">
                {% if user_role == 'editor' %}
                <button id="validate-btn" class="btn btn-secondary btn-md" data-action="validate-quadlet">
                    Validate
                </button>
                <button id="save-btn" class="btn btn-primary btn-md" data-action="save-quadlet">
                    Save Quadlet
                </button>
                {% endif %}
            </div>
            <button id="inspector-expand-btn" class="btn btn-sm btn-secondary" data-action="toggle-inspector-expand" title="Collapse inspector" aria-label="Collapse inspector"></button>
        </div>
    </div>
    <form id="save-form" hx-post="/api/save" hx-target="#status-toast" class="hidden">
        <input type="hidden" name="server_id" value="{{ server_id }}">
        <input type="hidden" name="file_path" value="{{ path }}">
        <input type="hidden" name="scope" value="{{ scope }}">
        <input type="hidden" name="unit_name" value="{{ unit_name }}">
        <input type="hidden" name="quadlet_type" value="{{ quadlet_type }}">
        <textarea name="content" id="hidden-content" aria-label="Quadlet file content"></textarea>
    </form>
    <div id="editor-container" data-file-name="{{ name }}" data-file-content="{{ content }}"></div>
    <div id="validation-results" hidden></div>

    <!-- Update the Inspector Pane simultaneously using HTMX OOB Swaps -->
    <div id="systemctl-actions" hx-swap-oob="true" class="space-x-2 mb-2">
        {% if user_role == 'editor' %}
        {% if quadlet_type == 'pod' %}
        <button class="btn btn-success"
                hx-post="/api/pod-action/{{ server_id }}?action=start&pod_name={{ pod_name }}&scope={{ scope }}" hx-target="#systemd-status">Start Pod</button>
        <button class="btn btn-danger"
                hx-post="/api/pod-action/{{ server_id }}?action=stop&pod_name={{ pod_name }}&scope={{ scope }}" hx-target="#systemd-status">Stop Pod</button>
        <button class="btn btn-warning"
                hx-post="/api/pod-action/{{ server_id }}?action=restart&pod_name={{ pod_name }}&scope={{ scope }}" hx-target="#systemd-status">Restart Pod</button>
        {% else %}
        <button class="btn btn-success"
                hx-post="/api/systemctl/{{ server_id }}?action=start&unit={{ unit_name }}&scope={{ scope }}&quadlet_type={{ quadlet_type }}" hx-target="#systemd-status">Start</button>
        <button class="btn btn-danger"
                hx-post="/api/systemctl/{{ server_id }}?action=stop&unit={{ unit_name }}&scope={{ scope }}&quadlet_type={{ quadlet_type }}" hx-target="#systemd-status">Stop</button>
        <button class="btn btn-warning"
                hx-post="/api/systemctl/{{ server_id }}?action=restart&unit={{ unit_name }}&scope={{ scope }}&quadlet_type={{ quadlet_type }}" hx-target="#systemd-status">Restart</button>
        {% endif %}
        {% endif %}
    </div>
    
    <div id="systemd-status" hx-swap-oob="true" hx-get="{{ status_url }}" hx-trigger="load, quadlet-saved from:body delay:2s" class="status-box">
        Loading status...
    </div>
</div>
