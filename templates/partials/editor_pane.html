<div id="editor-pane" class="main-content">
    <div class="header-bar">
        <h2 class="panel-title">Editor: {{ name }}</h2>
        <span id="unsaved-indicator" hidden title="Unsaved changes" aria-label="Unsaved changes">●</span>
        <div class="header-actions">
            <div id="editor-actions">
                <button id="validate-btn" class="btn btn-secondary btn-md" onclick="validateQuadlet()">
                    Validate
                </button>
                {% if user_role == 'editor' %}
                <button id="save-btn" class="btn btn-primary btn-md" onclick="saveQuadlet()">
                    Save Quadlet
                </button>
                {% endif %}
            </div>
            <button id="inspector-expand-btn" class="btn btn-sm btn-secondary" onclick="toggleInspectorExpand()" title="Collapse inspector" aria-label="Collapse inspector"></button>
        </div>
    </div>
    <form id="save-form" hx-post="/api/save" hx-target="#status-toast" class="hidden">
        <input type="hidden" name="server_id" value="{{ server_id }}">
        <input type="hidden" name="file_path" value="{{ path }}">
        <input type="hidden" name="scope" value="{{ scope }}">
        <input type="hidden" name="unit_name" value="{{ unit_name }}">
        <textarea name="content" id="hidden-content"></textarea>
    </form>
    <div id="editor-container"></div>
    <div id="validation-results" hidden></div>

    <!-- Update the Inspector Pane simultaneously using HTMX OOB Swaps -->
    <div id="systemctl-actions" hx-swap-oob="true" class="space-x-2 mb-2">
        {% if user_role == 'editor' %}
        {% if quadlet_type == 'pod' %}
        <button class="btn btn-success"
                hx-post="/api/pod-action/{{ server_id }}?action=start&pod_name={{ pod_name }}&scope={{ scope }}" hx-target="#systemd-status">Start Pod</button>
        <button class="btn btn-danger"
                hx-post="/api/pod-action/{{ server_id }}?action=stop&pod_name={{ pod_name }}&scope={{ scope }}" hx-target="#systemd-status">Stop Pod</button>
        <button class="btn btn-warning"
                hx-post="/api/pod-action/{{ server_id }}?action=restart&pod_name={{ pod_name }}&scope={{ scope }}" hx-target="#systemd-status">Restart Pod</button>
        {% else %}
        <button class="btn btn-success"
                hx-post="/api/systemctl/{{ server_id }}?action=start&unit={{ unit_name }}&scope={{ scope }}" hx-target="#systemd-status">Start</button>
        <button class="btn btn-danger"
                hx-post="/api/systemctl/{{ server_id }}?action=stop&unit={{ unit_name }}&scope={{ scope }}" hx-target="#systemd-status">Stop</button>
        <button class="btn btn-warning"
                hx-post="/api/systemctl/{{ server_id }}?action=restart&unit={{ unit_name }}&scope={{ scope }}" hx-target="#systemd-status">Restart</button>
        {% endif %}
        {% endif %}
    </div>
    
    <div id="systemd-status" hx-swap-oob="true" hx-get="{{ status_url }}" hx-trigger="load, quadlet-saved from:body delay:2s" class="status-box">
        Loading status...
    </div>
    
    <script>
        // Dispose any previously-running Monaco instance before requesting a new one.
        if (window.editor) {
            window.editor.dispose();
            window.editor = null;
        }

        // Capture the container reference *synchronously* (before require fires) so
        // that even if Monaco's async callback is delayed, it always writes into the
        // element that was present when THIS script block ran – not a later swap's
        // element that happens to share the same ID.
        (function() {
            var targetContainer = document.getElementById('editor-container');
            require(['vs/editor/editor.main'], function() {
                // Guard: if this container is no longer in the document (i.e. another
                // click happened and HTMX already replaced this pane), skip init.
                if (!document.body.contains(targetContainer)) return;
                window.editor = monaco.editor.create(targetContainer, {
                    value: `{{ safe_content | safe }}`,
                    language: 'ini',
                    theme: 'vs-dark',
                    automaticLayout: true
                });
                window._editorDirty = false;
                window.editor.onDidChangeModelContent(function() {
                    window._editorDirty = true;
                    var indicator = document.getElementById('unsaved-indicator');
                    if (indicator) indicator.removeAttribute('hidden');
                });
            });
        })();
    </script>
</div>
