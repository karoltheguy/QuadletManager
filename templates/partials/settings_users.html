{% if users %}
<table class="settings-table">
  <thead>
    <tr>
      <th>Username</th>
      <th>Role</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for u in users %}
    <tr>
      <td>{{ u[1] }}</td>
      <td>
        {% if u[1] == current_username %}
          <span class="badge badge-role">{{ u[2] }}</span>
        {% else %}
          <select class="form-control form-control-sm"
                  hx-put="/api/settings/users/{{ u[0] }}"
                  hx-target="#users-list"
                  hx-swap="innerHTML"
                  name="user_role"
                  hx-include="this">
            <option value="viewer" {% if u[2] == 'viewer' %}selected{% endif %}>viewer</option>
            <option value="editor" {% if u[2] == 'editor' %}selected{% endif %}>editor</option>
          </select>
        {% endif %}
      </td>
      <td>
        {% if u[1] != current_username %}
        <button class="btn btn-sm btn-danger"
                hx-delete="/api/settings/users/{{ u[0] }}"
                hx-target="#users-list"
                hx-swap="innerHTML"
                hx-confirm="Delete user '{{ u[1] }}'?">
          Delete
        </button>
        {% else %}
        <span class="text-muted text-sm">(you)</span>
        {% endif %}
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p class="text-muted italic">No users found.</p>
{% endif %}
