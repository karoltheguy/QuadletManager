{% if servers %}
<table class="settings-table">
  <thead>
    <tr>
      <th>Name</th>
      <th>IP Address</th>
      <th>SSH User</th>
      <th>SSH Key</th>
      {% if is_admin %}<th></th>{% endif %}
    </tr>
  </thead>
  <tbody>
    {% for s in servers %}
    <tr>
      <td>{{ s[1] }}</td>
      <td>{{ s[2] }}</td>
      <td>{{ s[3] }}</td>
      <td>{{ s[4] or '—' }}</td>
      {% if is_admin %}
      <td>
        <button class="btn btn-sm btn-danger"
                hx-delete="/api/settings/servers/{{ s[0] }}"
                hx-target="#servers-list"
                hx-swap="innerHTML"
                hx-confirm="Remove server '{{ s[1] }}'?">
          Remove
        </button>
      </td>
      {% endif %}
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p class="text-muted italic">No servers configured yet.</p>
{% endif %}
