<!DOCTYPE html>
<html>
<head>
    <title>QuadletManager Setup</title>
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="top-nav">
        <div class="nav-brand pl-4">QM Dashboard</div>
  <div class="nav-links">
    <button class="nav-item active" onclick="switchTab('dashboard')">Dashboard</button>
    <button class="nav-item" onclick="switchTab('monitoring')">Monitoring</button>
    <button class="nav-item" onclick="switchTab('editor')">Editor</button>
    <button class="nav-item" onclick="switchTab('settings')">Settings</button>
  </div>
    </nav>
    <div class="app-container">
        <div id="navigator" class="sidebar">
            <div class="header-bar pb-0" style="padding-left:0; padding-right:0; padding-top:0;">
                <h2 class="panel-title">Servers</h2>
                {% if user_role == 'editor' %}
                <button class="btn btn-primary btn-sm"
                        hx-get="/api/modal/new" hx-target="body" hx-swap="beforeend">
                    + New
                </button>
                {% endif %}
            </div>
            <div hx-get="/api/servers" hx-trigger="load, reload-servers from:body" class="mt-4">Loading servers...</div>
        </div>
        
        <div id="resize-handle-left" class="resize-handle" aria-hidden="true"></div>
        
  <div id="monitoring-pane" class="monitoring-pane">
    <div class="header-bar">
      <h2 class="panel-title">Monitoring</h2>
      <div class="server-selector">
        <select id="monitoring-server-select" class="form-control" onchange="selectMonitoringServer(this.value)">
          <option value="">Select a server...</option>
        </select>
      </div>
    </div>
    <div class="monitoring-content">
      <div class="stats-container monitoring-chart-container">
        <div style="height: 300px; position: relative; width: 100%;">
          <canvas id="monitoring-chart"></canvas>
        </div>
      </div>
      <div id="monitoring-stats-table" class="stats-table-wrapper monitoring-table">
        <div class="p-4 text-muted italic">Waiting for stats data...</div>
      </div>
    </div>
  </div>

  <div id="settings-pane" class="settings-pane">
    <h2 class="panel-title mb-4">Settings</h2>
    <p class="text-muted">Configuration options will appear here.</p>
  </div>
        
        <div id="editor-pane" class="main-content">
            <div class="header-bar">
                <h2 class="panel-title">Editor</h2>
                <!-- Buttons injected dynamically when a file is opened -->
                <div id="editor-actions"></div>
            </div>
            <!-- The form that HTMX submits -->
            <form id="save-form" hx-post="/api/save" hx-target="#status-toast" class="hidden">
                <input type="hidden" name="server_id" id="hidden-server-id">
                <input type="hidden" name="file_path" id="hidden-file-path">
                <input type="hidden" name="scope" id="hidden-scope">
                <input type="hidden" name="unit_name" id="hidden-unit-name">
                <textarea name="content" id="hidden-content"></textarea>
            </form>
            <div id="editor-container">
                # Select a file from the navigator...
            </div>
        </div>
        
        <div id="resize-handle-right" class="resize-handle" aria-hidden="true"></div>
        
  <div id="inspector" class="inspector-panel">
    <h2 class="panel-title mb-4">Inspector</h2>
    <div id="status-toast" class="mb-4"></div>

    <div class="space-x-2 mb-2" id="systemctl-actions">
      <!-- Action buttons loaded dynamically -->
    </div>

    <div id="systemd-status" class="status-box">
      Systemd status will appear here...
    </div>
  </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <script src="/static/main.js"></script>
</body>
</html>
