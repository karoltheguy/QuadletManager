<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuadletManager – Change Password</title>
    <meta name="description" content="Set a new password for your QuadletManager account.">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('qm-theme');
                if (saved === 'light' || saved === 'dark') {
                    document.documentElement.dataset.theme = saved;
                }
            } catch (e) {}
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ── Design tokens (subset of style.css) ────────────────
           Self-contained so the change-password page has zero external CSS deps. */
        :root,
        :root[data-theme="dark"] {
            --bg-base:    #1c1f24;
            --bg-surface: #22262d;
            --bg-element: #2a2e36;
            --border-color: #2e333b;
            --text-primary: #e8ecf0;
            --text-muted:   #8b9199;
            --brand-primary: #14b8a6;
            --danger: #ef4444;
            --nm-shadow-dark:  rgba(0, 0, 0, 0.55);
            --nm-shadow-light: rgba(255, 255, 255, 0.04);
            --shadow-raised:
                8px 8px 20px var(--nm-shadow-dark),
                -6px -6px 16px var(--nm-shadow-light),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            --shadow-raised-sm:
                4px 4px 10px var(--nm-shadow-dark),
                -3px -3px 8px var(--nm-shadow-light),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            --shadow-inset:
                inset 4px 4px 10px var(--nm-shadow-dark),
                inset -3px -3px 8px var(--nm-shadow-light);
            --radius-lg: 1.25rem;
            --radius-md: 0.75rem;
        }

        :root[data-theme="light"] {
            --bg-base:    #e8ecf0;
            --bg-surface: #eef1f5;
            --bg-element: #e0e4ea;
            --border-color: #d3d8e0;
            --text-primary: #1c1f24;
            --text-muted:   #6b7280;
            --brand-primary: #0e7268;
            --danger: #dc2626;
            --nm-shadow-dark:  rgba(163, 177, 198, 0.55);
            --nm-shadow-light: rgba(255, 255, 255, 0.9);
            --shadow-raised:
                8px 8px 20px var(--nm-shadow-dark),
                -8px -8px 20px var(--nm-shadow-light),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            --shadow-raised-sm:
                4px 4px 10px var(--nm-shadow-dark),
                -4px -4px 10px var(--nm-shadow-light),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            --shadow-inset:
                inset 4px 4px 10px var(--nm-shadow-dark),
                inset -4px -4px 10px var(--nm-shadow-light);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 0 20px;
        }

        .login-card {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            padding: 48px 40px 40px;
            box-shadow: var(--shadow-raised);
        }

        .brand {
            text-align: center;
            margin-bottom: 36px;
        }

        .brand h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .brand p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .input-wrapper input {
            width: 100%;
            background: var(--bg-base);
            border: none;
            border-radius: var(--radius-md);
            padding: 14px 16px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text-primary);
            outline: none;
            box-shadow: var(--shadow-inset);
            transition: box-shadow 0.2s;
        }

        .input-wrapper input:focus {
            box-shadow: var(--shadow-inset), 0 0 0 2px var(--brand-primary);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            letter-spacing: 0.02em;
            color: #fff;
            background: var(--brand-primary);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: var(--shadow-raised-sm);
            transition: box-shadow 0.15s, opacity 0.15s;
            margin-top: 8px;
        }

        .btn-login:hover {
            opacity: 0.92;
        }

        .btn-login:active {
            box-shadow: var(--shadow-inset);
            opacity: 1;
        }

        .error-msg {
            background: var(--bg-base);
            box-shadow: var(--shadow-inset);
            border-radius: var(--radius-md);
            border-left: 3px solid var(--danger);
            padding: 12px 16px;
            font-size: 13px;
            color: var(--danger);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .footer-hint {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="brand">
                <h1>Change Password</h1>
                <p>You must set a new password before continuing</p>
            </div>

            {% if error %}
            <div class="error-msg">
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="/change-password" id="change-password-form">
                <div class="form-group">
                    <label for="new_password">New Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="new_password" name="new_password" placeholder="Enter new password" autocomplete="new-password" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password" autocomplete="new-password" required>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="change-password-btn">Set Password</button>
            </form>

            <div class="footer-hint">
                Secured access &middot; Session expires after inactivity
            </div>
        </div>
    </div>
</body>
</html>
