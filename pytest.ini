[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# pytest-timeout has been in requirements-test.txt all along but was never
# switched on, so a wedged test had nothing to stop it -- the v0.1.0 tag's e2e
# job sat in `Run e2e tests` indefinitely while the identical commit passed on
# main in 2m40s. A per-test ceiling turns that opaque hang into a named failure
# with a traceback. The slowest suite completes in well under this budget.
timeout = 120

markers =
    unit: fast tests that do not require Docker, network services, or browsers
    integration: tests that require Docker Compose or service dependencies
    e2e: end-to-end/browser tests, usually Playwright-backed
    podman: tests requiring a live Podman 5 host over SSH